name: Bug Report
description: Report a bug or issue in the platform
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
